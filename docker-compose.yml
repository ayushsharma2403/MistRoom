services:
  db:
    image: mysql:8.0
    container_name: mistroom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mistroom_root_pass
      MYSQL_DATABASE: mistroom
      MYSQL_USER: mistroom_user
      MYSQL_PASSWORD: mistroom_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mistroom_user", "-pmistroom_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: mistroom-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: mistroom_user
      MYSQL_PASSWORD: mistroom_pass
      MYSQL_DATABASE: mistroom
    ports:
      - "3000:3000"

volumes:
  db_data:
