name: cloakroom_mesh
description: CloakRoom — Offline P2P Mesh Anonymous Chat with End-to-End Encryption
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^15.1.2

  # Cryptography — X25519 key exchange + AES-256-GCM
  cryptography: ^2.7.0

  # Secure key storage
  flutter_secure_storage: ^9.2.4

  # Local encrypted message storage
  hive: ^4.0.0
  hive_flutter: ^1.1.0

  # Unique IDs
  uuid: ^4.5.1

  # Google Fonts
  google_fonts: ^6.2.2

  # State management
  provider: ^6.1.5

  # Nearby Connections (Android P2P)
  nearby_connections: ^5.0.0

  # Share room codes
  share_plus: ^11.0.0

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
