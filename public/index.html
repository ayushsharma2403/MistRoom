<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173B45">
<link rel="manifest" href="manifest.json">
<title>MistRoom - E2EE Mesh</title>
<style>
:root{
  --fog:#DDE6EA;--paper:#F3F7F8;--ink:#14262E;--deep:#173B45;--sea:#2F7F86;
  --mute:#63797F;--line:#C3D1D6;--sos:#D93A25;--med:#B5541C;--ok:#2F7F86;
  --badge:#0F766E;--mesh:#8B5CF6;
}
@media (prefers-color-scheme:dark){
  :root{--fog:#0F1C21;--paper:#16272E;--ink:#E4EEF1;--deep:#0A1418;--sea:#5CB5BC;--mute:#8CA3AA;--line:#27404A;--badge:#14B8A6}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fog);color:var(--ink);display:flex;flex-direction:column}
header{background:var(--deep);color:#EAF3F5;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font:700 22px Georgia,"Times New Roman",serif;letter-spacing:.3px;user-select:none;cursor:pointer}
.logo i{font-style:normal;color:#7FD0D6}
.badges{display:flex;gap:6px;align-items:center;font-size:11px;font-weight:600}
.badge{padding:3px 8px;border-radius:12px;background:rgba(255,255,255,0.12);display:flex;align-items:center;gap:4px}
.badge.e2ee{background:rgba(47,127,134,0.3);color:#7FD0D6;border:1px solid #2F7F86}
.badge.mesh{background:rgba(139,92,246,0.25);color:#C4B5FD;border:1px solid #8B5CF6}
.status{margin-left:auto;font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#888}.dot.on{background:#5CE0A0}
main{flex:1;display:flex;min-height:0}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#pinned{background:var(--sos);color:#fff;padding:8px 14px;font-weight:600;display:none}
#list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:min(520px,86%);background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;overflow-wrap:anywhere;position:relative}
.msg.me{align-self:flex-end;border-radius:14px 14px 4px 14px;background:#CFE7EA;border-color:#A9D0D5}
@media (prefers-color-scheme:dark){.msg.me{background:#1F4450;border-color:#2F6070}}
.meta{font-size:12px;color:var(--mute);display:flex;gap:8px;margin-bottom:2px;align-items:center}
.meta .route{font-size:10px;padding:1px 5px;border-radius:8px;background:var(--line);color:var(--ink)}
.tag{font-weight:700;color:var(--med)}
.msg.sos{border:2px solid var(--sos);background:#FCE6E2}
@media (prefers-color-scheme:dark){.msg.sos{background:#3A1A16}}
.msg.sos .tag{color:var(--sos)}
.msg.medical{border-left:5px solid var(--med)}
.msg.water,.msg.shelter{border-left:5px solid var(--ok)}
.sys{align-self:center;font-size:13px;color:var(--mute);text-align:center;max-width:90%;background:rgba(0,0,0,0.04);padding:4px 12px;border-radius:12px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
input{font-size:16px;-webkit-user-select:text;user-select:text;font-family:inherit;color:var(--ink);background:var(--fog);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
#text{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--sea);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid #7FD0D6;outline-offset:2px}
#sos{background:var(--sos);letter-spacing:.5px}
aside{width:250px;background:var(--paper);border-left:1px solid var(--line);padding:14px;overflow-y:auto;display:flex;flex-direction:column}
aside h3{margin:0 0 8px;font-size:15px}
.radar{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--line) 1px,transparent 1px) center/100% 100%;border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.radar::before,.radar::after{content:"";position:absolute;inset:25%;border:1px solid var(--line);border-radius:50%}
.radar::after{inset:0;background:conic-gradient(from 0deg,transparent 0 300deg,rgba(92,181,188,.35));animation:sweep 4s linear infinite;border:0}
.radar b{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--sea);transform:translate(-50%,-50%)}
.radar b.you{background:var(--sos)}
.radar b.mesh-peer{background:var(--mesh)}
@keyframes sweep{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.radar::after{animation:none}}
ul{list-style:none;padding:0;margin:0;font-size:14px;flex:1}li{padding:4px 0;display:flex;justify-content:space-between;align-items:center}
li span.p2p{font-size:10px;color:var(--mesh);background:rgba(139,92,246,0.15);padding:1px 6px;border-radius:8px}
#sum{margin-top:12px;width:100%;background:var(--deep)}
#join{position:fixed;inset:0;background:var(--fog);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:380px;width:100%;text-align:center}
.card h1{font:700 32px Georgia,serif;margin:0 0 4px;color:var(--deep)}
@media (prefers-color-scheme:dark){.card h1{color:#EAF3F5}}
.card p{color:var(--mute);margin:0 0 16px;font-size:14px}
.join-input{
  display:block !important;
  width:100% !important;
  margin-bottom:12px !important;
  padding:12px 14px !important;
  font-size:16px !important;
  font-family:inherit !important;
  border-radius:10px !important;
  border:2px solid var(--sea) !important;
  background:#ffffff !important;
  color:#14262E !important;
  outline:none !important;
  box-sizing:border-box !important;
}
@media (prefers-color-scheme:dark){
  .join-input{
    background:#1E333C !important;
    color:#EAF3F5 !important;
    border-color:var(--sea) !important;
  }
}
.join-input:focus{
  border-color:var(--ok) !important;
  box-shadow:0 0 0 2px rgba(47,127,134,0.3) !important;
}
.pwd-wrap{position:relative;display:block;width:100%}
.pwd-wrap .join-input{padding-right:40px !important}
.toggle-pwd{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:transparent;border:0;padding:6px;cursor:pointer;font-size:16px;color:var(--mute);line-height:1}
.card button#go{width:100%;cursor:pointer;margin-top:4px}
.sec-note{font-size:12px;color:var(--mute);margin-top:8px;text-align:left}
.qr{width:130px;height:130px;margin:14px auto 0;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
.qr img{width:100%;height:100%;display:block}
@media (max-width:640px){aside{display:none}#showp{display:inline-block!important}}
#showp{display:none;background:transparent;border:1px solid #7FD0D6;padding:4px 10px}
</style>
</head>
<body>
<div id="join"><div class="card">
  <h1>MistRoom</h1>
  <p>Privacy-First Anonymous Chat & Emergency Mesh</p>
  <input id="name" class="join-input" type="text" maxlength="20" placeholder="Your nickname" autocomplete="off" autocapitalize="words" autofocus>
  <div class="pwd-wrap">
    <input id="secret" class="join-input" type="text" placeholder="Room Passkey (E2EE)" value="mistroom-safe" autocomplete="off">
    <button type="button" class="toggle-pwd" id="eye" title="Toggle visibility">👁️</button>
  </div>
  <p class="sec-note">🔒 <b>Zero-Logging E2EE:</b> All messages are encrypted with AES-256 before leaving your browser. Central servers and logs cannot read your messages.</p>
  <button type="button" id="go">Join Secure Mesh</button>
  <div class="qr" id="qrbox"><img src="/qr.svg" alt="QR code to join"></div>
</div></div>

<header>
  <div class="logo" id="logo">Mist<i>Room</i></div>
  <div class="badges">
    <span class="badge e2ee">🔒 E2EE Active</span>
    <span class="badge mesh" id="mesh-badge">⚡ Mesh: 0 P2P</span>
  </div>
  <button id="showp">Peers</button>
  <div class="status"><span class="dot" id="dot"></span><span id="st">Connecting</span></div>
</header>
<main>
  <section id="chat">
    <div id="pinned"></div>
    <div id="list" aria-live="polite"></div>
    <form id="f">
      <input id="text" type="text" placeholder="Encrypted message (E2EE)" autocomplete="off" maxlength="500" enterkeyhint="send">
      <button>Send</button>
      <button type="button" id="gps" title="Share GPS Coordinates">📍 GPS</button>
      <button type="button" id="sos">SOS</button>
    </form>
  </section>
  <aside id="side">
    <h3>Nearby Peers <span id="count"></span></h3>
    <div class="radar" id="radar"></div>
    <ul id="people"></ul>
    <button id="sum">AI Situation Summary</button>
  </aside>
</main>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error:', err));
  });
}
</script>
<script src="app.js?v=3.1"></script>
</body>
</html>
